<!-- templates/result.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Career Results - Intelligent Career Guidance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="animated-bg"></div>
    
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-brain"></i>
                <span>CareerGuide<span class="accent">AI</span></span>
            </div>
            <div class="nav-links">
                <a href="/"><i class="fas fa-home"></i> Home</a>
                <a href="/form"><i class="fas fa-clipboard-list"></i> Assessment</a>
            </div>
        </div>
    </nav>

    <main class="results-container" id="resultsContainer">
        <div id="resultsContent">
            <!-- Results will be dynamically loaded here -->
        </div>
    </main>

    <!-- Chatbot Widget -->
    <div class="chat-widget">
        <div class="chat-toggle" id="chatToggle">
            <i class="fas fa-comment-dots"></i>
            <div class="notification-badge"></div>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="chat-header">
    <div class="chat-header-info">
        <div class="chat-avatar">
            <i class="fas fa-robot"></i>
        </div>
        <div>
            <h4>Career Assistant</h4>
            <p>Online • Ready to help</p>
        </div>
    </div>
    <div class="chat-header-actions">
        <button class="reset-chat-btn" id="resetChatBtn" title="Reset Conversation">
            <i class="fas fa-sync-alt"></i>
        </button>
        <button class="chat-close" id="chatClose">
            <i class="fas fa-times"></i>
        </button>
    </div>
</div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <div class="message-avatar">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="message-content">
                        <p>🎉 Congratulations on completing the assessment!</p>
                        <p>Want to learn more about your recommended careers? Ask me anything!</p>
                    </div>
                </div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Ask about your career results..." autocomplete="off">
                <button id="chatSendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
